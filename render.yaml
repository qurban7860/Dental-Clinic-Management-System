services:
  - type: web
    name: dental-clinic-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dental-clinic-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false

  - type: web
    name: dental-clinic-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: dental-clinic-db
    plan: free
